<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompanyDB — Target Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
/* ---- Confidentus brand palette ---- */
:root{
  --c-earth:#454132; --c-earth-soft:#5c5745; --c-gold:#A77A00; --c-gold-bright:#E9AC14;
  --c-gold-soft:#D4AB42; --c-olive:#AEA730; --c-bg:#faf8f3; --c-surface:#ffffff;
  --c-border:#e5e1d5; --c-text:#2a2820; --c-text-soft:#6a6552;
  --c-success:#4d7c2c; --c-danger:#a63b1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Calibri','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--c-bg);color:var(--c-text);font-size:14px}

/* ---- Top bar ---- */
.topbar{background:var(--c-earth);border-bottom:3px solid var(--c-gold);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;color:#fff}
.brand-logo{height:30px;width:auto;display:block}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:.02em}
.topbar-sub{color:var(--c-gold-bright);font-weight:400;font-size:12px;letter-spacing:.04em;font-style:italic;opacity:.85}
.topbar .spacer{flex:1}
.topbar-refreshed{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:.02em;cursor:pointer;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,.12);transition:all .12s}
.topbar-refreshed:hover{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.topbar-refreshed:empty{display:none}
.btn{padding:7px 14px;border:1px solid var(--c-border);border-radius:4px;font-size:13px;background:#fff;cursor:pointer;white-space:nowrap;font-weight:600;font-family:inherit;color:var(--c-text);transition:all .12s ease;text-decoration:none;display:inline-block}
.btn:hover{background:#f5f2e8}
.btn-primary{background:var(--c-gold);color:#fff;border-color:var(--c-gold)}
.btn-primary:hover{background:#8f6700;border-color:#8f6700}
.btn-link{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-link:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}

/* ---- Layout ---- */
.main-layout{display:flex;min-height:calc(100vh - 60px);background:var(--c-bg)}
.sidebar{width:300px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;overflow:hidden;position:sticky;top:60px;height:calc(100vh - 60px)}
.sidebar-section{padding:14px 14px 10px;border-bottom:1px solid var(--c-border)}
.sidebar-section.facet{flex:1;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.sidebar-title{font-size:10.5px;font-weight:700;color:var(--c-text-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sidebar label{font-size:11px;color:var(--c-text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin:10px 0 4px}
.sidebar label:first-of-type{margin-top:0}
.sidebar input[type=text],.sidebar input[type=number],.sidebar select{width:100%;padding:6px 9px;border:1px solid var(--c-border);border-radius:3px;font-size:13px;background:#fff;color:var(--c-text);font-family:inherit}
.sidebar input:focus,.sidebar select:focus{outline:none;border-color:var(--c-gold);box-shadow:0 0 0 2px rgba(167,122,0,.12)}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sidebar-watchlist{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-text);cursor:pointer;margin-top:14px;user-select:none}
.sidebar-watchlist input{accent-color:var(--c-gold);cursor:pointer}
.facet-actions{font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0}
.facet-actions a{color:var(--c-gold);cursor:pointer;text-decoration:none}
.facet-actions a:hover{text-decoration:underline}
.facet-list{flex:1;overflow-y:auto;border-top:1px solid var(--c-border);margin-top:6px}
.facet-item{padding:7px 4px;cursor:pointer;border-bottom:1px solid #f5f2e8;display:flex;align-items:flex-start;gap:8px;font-size:12.5px;transition:background .08s}
.facet-item:hover{background:#faf8f0}
.facet-item input{margin-top:2px;flex-shrink:0;accent-color:var(--c-gold);cursor:pointer}
.facet-item .fi-body{flex:1;min-width:0;overflow:hidden}
.facet-item .fi-name{color:var(--c-earth);font-weight:600;white-space:normal;line-height:1.25}
.facet-item .fi-count{color:var(--c-text-soft);font-size:11px;white-space:nowrap}
.facet-empty{padding:14px 4px;color:var(--c-text-soft);font-size:12px}
.sidebar-foot{padding:10px 14px;border-top:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center}
.result-count{font-size:12px;color:var(--c-text-soft);font-weight:700}
.clear-btn{background:transparent;border:1px solid var(--c-border);color:var(--c-text-soft);padding:4px 10px;font-size:11px;border-radius:3px;cursor:pointer;font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.clear-btn:hover{color:var(--c-earth);border-color:var(--c-earth)}

/* ---- Main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:calc(100vh - 60px)}
.results-meta{padding:14px 18px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.results-meta .rm-title{font-size:16px;font-weight:700;color:var(--c-earth)}
.results-meta .rm-count{font-size:13px;color:var(--c-text-soft);font-weight:600}
.results-meta .rm-filters{font-size:12px;color:var(--c-text-soft)}
.note{padding:0 18px 8px;font-size:11.5px;color:var(--c-text-soft);font-style:italic}

.table-scroll{flex:1;overflow:auto;margin:0 18px 18px;border:1px solid var(--c-border);border-radius:4px;background:var(--c-surface)}
table.rt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.rt thead th{position:sticky;top:0;z-index:5;background:var(--c-earth);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:9px 12px;text-align:right;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:2px solid var(--c-gold)}
table.rt thead th.left{text-align:left}
table.rt thead th:hover{background:var(--c-earth-soft)}
table.rt thead th .arr{color:var(--c-gold-bright);margin-left:4px;font-size:10px}
table.rt thead th.col-name{position:sticky;left:0;z-index:6;min-width:230px;max-width:330px}
table.rt thead th.col-sector{min-width:200px;max-width:260px}
table.rt tbody td{padding:6px 12px;height:34px;font-size:12.5px;border-bottom:1px solid #f1eee3;text-align:right;white-space:nowrap;color:var(--c-text);overflow:hidden}
table.rt tbody td.col-name{position:sticky;left:0;z-index:1;background:var(--c-surface);text-align:left;font-weight:600;color:var(--c-earth);text-overflow:ellipsis;max-width:330px}
table.rt tbody td.col-sector{text-align:left;color:var(--c-text-soft);text-overflow:ellipsis;max-width:260px}
table.rt tbody tr:hover td{background:#faf8f0}
table.rt tbody tr:hover td.col-name{background:#f4efe1}
table.rt tbody td.spacer{position:static;padding:0;border:none;height:auto}
table.rt td .neg{color:var(--c-danger)}
table.rt td .muted{color:#bdb7a4}
table.rt td .salyr{color:#bdb7a4;font-size:10.5px;margin-left:3px}
.empty-state{padding:48px 24px;text-align:center;color:var(--c-text-soft);font-size:14px}

/* ---- Loading overlay & toast ---- */
.loading-overlay{position:fixed;inset:0;background:rgba(250,248,243,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:14px}
.spinner{width:40px;height:40px;border:4px solid var(--c-border);border-top-color:var(--c-gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:13px;color:var(--c-text-soft);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--c-earth);color:#fff;padding:10px 18px;border-radius:5px;font-size:13px;z-index:1500;box-shadow:0 6px 20px rgba(69,65,50,.3);border-left:3px solid var(--c-gold)}
</style>
</head>

<div class="main-layout">

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Search &amp; Filter</div>
      <label>Company (name or JAR)</label>
      <input type="text" id="f-search" placeholder="Search companies…" oninput="onSearchInput()">

      <label>Municipality</label>
      <select id="f-muni" onchange="scheduleScreen(0)">
        <option value="">All municipalities</option>
      </select>

      <label>Filter year (revenue / EBT / margin)</label>
      <select id="f-year" onchange="scheduleScreen(0)">
        <option value="2025">2025</option>

    <div class="sidebar-section">

      <label>Min employees (latest SODRA)</label>
      <input type="number" id="f-emp" placeholder="e.g. 10" min="0" oninput="scheduleScreen()">

      <label>Revenue (€)</label>
      <div class="filter-row">
        <input type="number" id="f-rev-min" placeholder="Min" oninput="scheduleScreen()">
        <input type="number" id="f-rev-max" placeholder="Max" oninput="scheduleScreen()">

        <input type="number" id="f-margin-min" placeholder="Min %" oninput="scheduleScreen()">
        <input type="number" id="f-margin-max" placeholder="Max %" oninput="scheduleScreen()">

      <label>Avg salary €/mo (latest SODRA)</label>
      <div class="filter-row">
        <input type="number" id="f-sal-min" placeholder="Min" oninput="scheduleScreen()">
        <input type="number" id="f-sal-max" placeholder="Max" oninput="scheduleScreen()">

      <label class="sidebar-watchlist">

    <div class="sidebar-section facet">

  municipalities: [],
  lastRefreshTs: null,
  dataLoaded: false,

  filters: {},
  results: [],               // row objects after criteria (before facet)
  facet: [],                 // [{evrk_code, evrk_name, count}]
  excludedSectors: new Set(),// sectors unticked in the facet
  display: [],               // rows after facet + name-search + sort
  sortCol: 'rev_' + 2024,
  sortDir: 'desc'
};

/* ==========================================================
 *  Helpers
 * ========================================================== */
function fmtEUR(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const v = el.value;
  if (v === '' || v == null) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

/* ==========================================================
 *  Supabase fetch  (verbatim from dashboard — keyset pagination)
 * ========================================================== */
async function sbFetch(path, extraHeaders) {
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const res = await fetch(url, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Accept': 'application/json', ...(extraHeaders || {}) }
  });
  if (!res.ok) { const text = await res.text(); throw new Error(`Supabase ${res.status}: ${text.slice(0,200)}`); }
  const data = await res.json();
  return { data, headers: res.headers };
}

async function sbFetchAll(path, onProgress, cursorCol = 'jar_kodas') {
  const results = [];
  let cursor = null, total = null, firstPage = true, guard = 0;
  while (true) {
    const sep = path.includes('?') ? '&' : '?';
    let pageUrl = `${path}${sep}limit=${PAGE_SIZE}`;
    if (cursor !== null) pageUrl += `&${cursorCol}=gt.${encodeURIComponent(cursor)}`;
    const headers = firstPage ? { 'Prefer': 'count=exact' } : {};
    const { data, headers: resHeaders } = await sbFetch(pageUrl, headers);
    if (firstPage) {
      const cr = resHeaders.get('content-range');
      if (cr) { const m = cr.match(/\/(\d+|\*)$/); if (m && m[1] !== '*') total = parseInt(m[1]); }
      firstPage = false;
    }
    if (data.length === 0) break;
    const lastVal = data[data.length - 1][cursorCol];
    if (data.length < PAGE_SIZE) { results.push(...data); if (onProgress) onProgress(results.length, total); break; }
    let cut = data.length;
    while (cut > 0 && data[cut - 1][cursorCol] === lastVal) cut--;
    if (cut === 0) { results.push(...data); cursor = lastVal; }
    else { results.push(...data.slice(0, cut)); cursor = data[cut - 1][cursorCol]; }
    if (onProgress) onProgress(results.length, total);
    if (++guard > 100000) break;
  }
  return results;
}

/* ==========================================================
 *  SODRA lazy-loader  (verbatim from dashboard)
 * ========================================================== */
const SODRA_BATCH_SIZE = 500;
const sodraFetchedJars = new Set();
const sodraInflight = new Map();

async function ensureSodraLoaded(jarCodes, onProgress) {
  const toFetch = [], pendingPromises = [];
  for (const jar of jarCodes) {
    if (!jar) continue;
    if (sodraFetchedJars.has(jar)) continue;
    if (sodraInflight.has(jar)) { pendingPromises.push(sodraInflight.get(jar)); continue; }
    toFetch.push(jar);
  }
  if (toFetch.length === 0) { if (pendingPromises.length) await Promise.all(pendingPromises); return; }
  const batches = [];
  for (let i = 0; i < toFetch.length; i += SODRA_BATCH_SIZE) batches.push(toFetch.slice(i, i + SODRA_BATCH_SIZE));
  const batchPromises = batches.map((batch) => {
    const promise = (async () => {
      const jarFilter = `in.(${batch.join(',')})`;
      const path = `sodra_workforce?select=jar_kodas,period_year,employees_avg,avg_salary&jar_kodas=${encodeURIComponent(jarFilter)}&order=jar_kodas,period_year`;
      const rows = await sbFetchAll(path);
      const sByCompanyYear = {};
      for (const s of rows) {
        if (!s.period_year) continue;
        const y = s.period_year, k = s.jar_kodas;
        if (!sByCompanyYear[k]) sByCompanyYear[k] = {};
        if (!sByCompanyYear[k][y]) sByCompanyYear[k][y] = { emps: [], sals: [] };
        if (s.employees_avg != null) sByCompanyYear[k][y].emps.push(s.employees_avg);
        if (s.avg_salary != null && s.avg_salary > 0) sByCompanyYear[k][y].sals.push(s.avg_salary);
      }
      for (const k in sByCompanyYear) {
        if (!state.sodra[k]) state.sodra[k] = {};
        for (const y in sByCompanyYear[k]) {
          const { emps, sals } = sByCompanyYear[k][y];
          state.sodra[k][y] = {
            avg_employees: emps.length ? emps.reduce((a,b)=>a+b,0)/emps.length : null,
            avg_salary:    sals.length ? sals.reduce((a,b)=>a+b,0)/sals.length : null
          };
        }
      }
      for (const jar of batch) sodraFetchedJars.add(jar);
    })();
    for (const jar of batch) sodraInflight.set(jar, promise);
    promise.finally(() => { for (const jar of batch) sodraInflight.delete(jar); });
    return promise;
  });
  if (onProgress) {
    let done = 0; const total = batches.length;
    for (const p of batchPromises) p.then(() => { done += 1; onProgress(done, total); }).catch(()=>{});
  }
  await Promise.all([...batchPromises, ...pendingPromises]);
  scheduleCacheSave();
  computeLatestYears();
}

let cacheSaveTimer = null;
function scheduleCacheSave() {
  if (cacheSaveTimer) clearTimeout(cacheSaveTimer);
  cacheSaveTimer = setTimeout(() => { saveCache().catch(e => console.warn('Cache save failed', e)); }, 1500);
}

/* ==========================================================
 *  IndexedDB cache  (shared store companydb_v3 with the dashboard)
 * ========================================================== */
const IDB_NAME = 'companydb_v3', IDB_STORE = 'dataset', IDB_KEY = 'snapshot';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try { const db = await idbOpen();
    return await new Promise((resolve, reject) => { const tx = db.transaction(IDB_STORE, 'readonly'); const req = tx.objectStore(IDB_STORE).get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); });
  } catch(e) { console.warn('idbGet failed:', e); return null; }
}
async function idbSet(key, value) {
  try { const db = await idbOpen();
    return await new Promise((resolve, reject) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).put(value, key); tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); });
  } catch(e) { console.warn('idbSet failed:', e); return false; }
}
async function loadCache() { return await idbGet(IDB_KEY); }
async function saveCache() {
  const payload = { ts: state.lastRefreshTs || Date.now(), allCompanies: state.allCompanies, financials: state.financials, sodra: state.sodra };
  const ok = await idbSet(IDB_KEY, payload);
  if (ok) console.log('Cache saved at', new Date(payload.ts).toISOString());
  return ok;
}

/* ==========================================================
 *  Derived years  (verbatim logic from dashboard)
 * ========================================================== */
function computeLatestYears() {
  const countsByYear = {};
  for (const jar in state.financials)
    for (const f of state.financials[jar])
      if (f.revenue != null && f.revenue > 0) countsByYear[f.year] = (countsByYear[f.year] || 0) + 1;
  const sortedYears = Object.keys(countsByYear).map(Number).sort((a, b) => b - a);
  const THRESH = 0.50;
  let latestFin = null, rawLatest = null, rawLatestRate = null;
  for (let i = 0; i < sortedYears.length - 1; i++) {
    const y = sortedYears[i], prevCount = countsByYear[sortedYears[i + 1]];
    const ratio = prevCount > 0 ? (countsByYear[y] / prevCount) : 1;
    if (rawLatest === null) { rawLatest = y; rawLatestRate = ratio; }
    if (ratio >= THRESH) { latestFin = y; break; }
  }
  if (latestFin === null) latestFin = sortedYears[0] || 2024;
  const prevFin = sortedYears.find(y => y < latestFin) || (latestFin - 1);
  FIN_LATEST_YEAR = latestFin; FIN_PREV_YEAR = prevFin;
  FIN_LATEST_IS_PARTIAL = (rawLatest !== null && rawLatest > latestFin);
  FIN_LATEST_FILING_RATE = rawLatestRate;
  let latestSo = 2015, prevSo = 2014;
  for (const jar in state.sodra) for (const y in state.sodra[jar]) {
    const yy = parseInt(y);
    if (yy > latestSo) { prevSo = latestSo; latestSo = yy; }
    else if (yy > prevSo && yy < latestSo) prevSo = yy;
  }
  SODRA_LATEST_YEAR = latestSo; SODRA_PREV_YEAR = prevSo;
}

/* ==========================================================
 *  Options builders
 * ========================================================== */
function buildSectorOptions() {
  const m = {};
  for (const c of state.allCompanies) {
    if (!c.evrk_code) continue;
    const k = c.evrk_code;
    if (!m[k]) m[k] = { evrk_code: k, evrk_name: c.evrk_name || k, count: 0 };
    m[k].count++;
  }
  state.sectorOptions = Object.values(m).sort((a,b) => b.count - a.count);
}
function buildMunicipalityOptions() {
  const s = new Set();
  for (const c of state.allCompanies) if (c.municipality) s.add(c.municipality);
  state.municipalities = [...s].sort((a,b)=>a.localeCompare(b,'lt'));
  const sel = document.getElementById('f-muni');
  if (sel) sel.innerHTML = '<option value="">All municipalities</option>' +
    state.municipalities.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
}
function seedSodraFetchedFromState() { for (const jar in state.sodra) sodraFetchedJars.add(jar); }

/* ==========================================================
 *  Per-company / per-year accessors
 * ========================================================== */
function finForYear(jar, year) { return (state.financials[jar] || []).find(f => f.year === year) || null; }
function revenueOf(jar, year) { const f = finForYear(jar, year); return f ? f.revenue : null; }
function ebtOf(jar, year) { const f = finForYear(jar, year); return f ? f.ebt : null; }
function marginOf(jar, year) { const f = finForYear(jar, year); return (f && f.revenue && f.revenue > 0 && f.ebt != null) ? (f.ebt / f.revenue) * 100 : null; }
// Latest available SODRA salary / employees for a company (max year with a value)
function latestSodra(jar, field) {
  const s = state.sodra[jar]; if (!s) return null;
  let best = null;
  for (const y in s) { const yy = parseInt(y); if (s[y][field] != null && (best === null || yy > best.year)) best = { year: yy, value: s[y][field] }; }
  return best;
}
function latestSalary(jar) { return latestSodra(jar, 'avg_salary'); }
function latestEmployees(jar) { const r = latestSodra(jar, 'avg_employees'); return r ? r.value : null; }

/* ==========================================================
 *  Data loading
 * ========================================================== */
async function loadAllData() {
  const cached = await loadCache();
  if (cached) {
    const seen = new Set(); const dedup = [];
    for (const c of (cached.allCompanies || [])) { if (seen.has(c.jar_kodas)) continue; seen.add(c.jar_kodas); dedup.push(c); }
    state.allCompanies = dedup;
    state.financials = cached.financials || {};
    state.sodra = cached.sodra || {};
    state.lastRefreshTs = cached.ts;
    seedSodraFetchedFromState();
    buildSectorOptions(); buildMunicipalityOptions(); computeLatestYears();
    state.dataLoaded = true;
    return { fromCache: true, cachedAt: cached.ts };
  }
  await fetchAndInstallData(false);
  state.dataLoaded = true;
  return { fromCache: false };
}

async function fetchAndInstallData(background) {
  const fmt = (n) => n.toLocaleString();
  const setMsg = (m) => { if (!background) setLoading(m); };
  const progressFor = (label) => (loaded, total) => {
    if (background) return;
    setLoading(total ? `${label} — ${fmt(loaded)} / ${fmt(total)} (${Math.min(100,Math.round(loaded/total*100))}%)` : `${label} — ${fmt(loaded)} loaded…`);
  };
  setMsg('Loading companies…');
  const companies = await sbFetchAll(
    'companies?select=jar_kodas,company_name,evrk_code,evrk_name,legal_form,municipality&order=jar_kodas',
    progressFor('Loading companies'));
  const seen = new Set(); const normalized = [];
  for (const c of companies) {
    if (seen.has(c.jar_kodas)) continue; seen.add(c.jar_kodas);
    normalized.push({ jar_kodas: c.jar_kodas, name: c.company_name || '', evrk_code: c.evrk_code, evrk_name: c.evrk_name, legal_form: c.legal_form, municipality: c.municipality || '' });
  }
  setMsg('Loading financials…');
  const fins = await sbFetchAll('financials?select=jar_kodas,fin_year,revenue,ebt,net_profit&order=jar_kodas,fin_year', progressFor('Loading financials'));
  const byJar = {};
  for (const f of fins) {
    (byJar[f.jar_kodas] = byJar[f.jar_kodas] || []).push({ jar_kodas: f.jar_kodas, year: f.fin_year, revenue: f.revenue, ebt: f.ebt, net_profit: f.net_profit });
  }
  for (const k in byJar) byJar[k].sort((a,b) => a.year - b.year);
  state.allCompanies = normalized;
  state.financials = byJar;
  if (!state.sodra || typeof state.sodra !== 'object') state.sodra = {};
  state.lastRefreshTs = Date.now();
  buildSectorOptions(); buildMunicipalityOptions(); computeLatestYears();
  await saveCache();
  updateRefreshedIndicator();
}

async function manualRefresh() {
  setLoading('Refreshing from database…');
  showOverlay();
  try { await fetchAndInstallData(false); scheduleScreen(0); showToast('Data refreshed'); }
  catch(e) { console.error(e); showToast('Refresh failed: ' + e.message); }
  finally { hideOverlay(); }
}

/* ==========================================================
 *  UI helpers
 * ========================================================== */
function setLoading(m){ const el=document.getElementById('loadingMsg'); if(el) el.textContent=m; }
function showOverlay(){ const o=document.getElementById('loadingOverlay'); if(o) o.style.display='flex'; }
function hideOverlay(){ const o=document.getElementById('loadingOverlay'); if(o) o.style.display='none'; }
let toastEl=null;
function showToast(msg){ hideToast(); toastEl=document.createElement('div'); toastEl.className='toast'; toastEl.textContent=msg; document.body.appendChild(toastEl); return toastEl; }
function hideToast(){ if(toastEl){ toastEl.remove(); toastEl=null; } }
function updateRefreshedIndicator(){
  const el=document.getElementById('refreshed'); if(!el) return;
  if(!state.lastRefreshTs){ el.textContent=''; return; }
  const mins=Math.round((Date.now()-state.lastRefreshTs)/60000);
  el.textContent = mins<1 ? 'updated just now' : mins<60 ? `updated ${mins}m ago` : `updated ${Math.round(mins/60)}h ago`;
}
setInterval(updateRefreshedIndicator, 60000);

/* ==========================================================
 *  Screening
 * ========================================================== */
function readFilters() {
  state.filters = {
    search: (document.getElementById('f-search')?.value || '').toLowerCase().trim(),
    muni: document.getElementById('f-muni')?.value || '',
    year: parseInt(document.getElementById('f-year')?.value || '2024') || 2024,
    minEmp: num('f-emp'),
    minRev: num('f-rev-min'), maxRev: num('f-rev-max'),
    minEbt: num('f-ebt-min'), maxEbt: num('f-ebt-max'),
    minMargin: num('f-margin-min'), maxMargin: num('f-margin-max'),
    minSal: num('f-sal-min'), maxSal: num('f-sal-max'),
    hideInactive: !!document.getElementById('f-hide-inactive')?.checked
  };
}

let screenTimer = null;
function scheduleScreen(delay = 300) {
  if (screenTimer) clearTimeout(screenTimer);
  screenTimer = setTimeout(runScreen, delay);
}

async function runScreen() {
  if (!state.dataLoaded) return;
  readFilters();
  const f = state.filters, y = f.year;

  // Stage 1 — filters that need only financials (fast, full universe).
  let base = state.allCompanies.filter(c => {
    if (f.hideInactive) {
      let active = false;
      for (let yy = FIN_LATEST_YEAR; yy > FIN_LATEST_YEAR - 3; yy--) { const r = revenueOf(c.jar_kodas, yy); if (r != null && r > 0) { active = true; break; } }
      if (!active) return false;
    }
    if (f.muni && c.municipality !== f.muni) return false;
    if (f.minRev != null || f.maxRev != null) { const r = revenueOf(c.jar_kodas, y); if (r == null) return false; if (f.minRev != null && r < f.minRev) return false; if (f.maxRev != null && r > f.maxRev) return false; }
    if (f.minEbt != null || f.maxEbt != null) { const e = ebtOf(c.jar_kodas, y); if (e == null) return false; if (f.minEbt != null && e < f.minEbt) return false; if (f.maxEbt != null && e > f.maxEbt) return false; }
    if (f.minMargin != null || f.maxMargin != null) { const m = marginOf(c.jar_kodas, y); if (m == null) return false; if (f.minMargin != null && m < f.minMargin) return false; if (f.maxMargin != null && m > f.maxMargin) return false; }
    return true;
  });

  // Stage 2 — SODRA-dependent filters (emp / salary). Load SODRA only for the candidate set.
  const needsSodra = (f.minEmp != null) || (f.minSal != null) || (f.maxSal != null);
  if (needsSodra && base.length) {
    const t = showToast(`Loading workforce data for ${base.length.toLocaleString()} companies…`);
    try { await ensureSodraLoaded(base.map(c => c.jar_kodas)); } catch(e) { console.warn(e); } finally { hideToast(); }
    base = base.filter(c => {
      if (f.minEmp != null) { const e = latestEmployees(c.jar_kodas); if (e == null || e < f.minEmp) return false; }
      if (f.minSal != null || f.maxSal != null) { const s = latestSalary(c.jar_kodas); if (!s) return false; if (f.minSal != null && s.value < f.minSal) return false; if (f.maxSal != null && s.value > f.maxSal) return false; }
      return true;
    });
  }

  // Build row objects once.
  state.results = base.map(c => {
    const row = { jar: c.jar_kodas, name: c.name, evrk_code: c.evrk_code, evrk_name: c.evrk_name || c.evrk_code || '' };
    for (const yr of FIN_YEARS) { row['rev_' + yr] = revenueOf(c.jar_kodas, yr); row['ebt_' + yr] = ebtOf(c.jar_kodas, yr); }
    return row;
  });

  buildFacet();
  renderFacet();
  applyDisplay();
}

function buildFacet() {
  const m = {};
  for (const r of state.results) {
    const k = r.evrk_code || '∅';
    if (!m[k]) m[k] = { evrk_code: r.evrk_code, evrk_name: r.evrk_name || '(no sector)', count: 0 };
    m[k].count++;
  }
  state.facet = Object.values(m).sort((a,b) => b.count - a.count);
  // Drop exclusions for sectors no longer present (keep the rest sticky across re-screens)
  const present = new Set(state.facet.map(s => s.evrk_code));
  for (const code of [...state.excludedSectors]) if (!present.has(code)) state.excludedSectors.delete(code);
}

function renderFacet() {
  const list = document.getElementById('facetList');
  if (!state.facet.length) { list.innerHTML = '<div class="facet-empty">No companies match the current filters.</div>'; return; }
  list.innerHTML = state.facet.map(s => {
    const checked = !state.excludedSectors.has(s.evrk_code);
    const key = JSON.stringify(s.evrk_code).replace(/"/g, '&quot;');
    return `<label class="facet-item">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSector(${key})">
      <span class="fi-body"><span class="fi-name">${escapeHtml(s.evrk_name)}</span></span>
      <span class="fi-count">${s.count.toLocaleString()}</span>
    </label>`;
  }).join('');
}
function toggleSector(code) {
  if (state.excludedSectors.has(code)) state.excludedSectors.delete(code);
  else state.excludedSectors.add(code);
  applyDisplay();
}
function facetAll() { state.excludedSectors.clear(); renderFacet(); applyDisplay(); }
function facetNone() { state.excludedSectors = new Set(state.facet.map(s => s.evrk_code)); renderFacet(); applyDisplay(); }

function onSearchInput() { state.filters.search = (document.getElementById('f-search')?.value || '').toLowerCase().trim(); applyDisplay(); }

// Apply facet exclusions + name search + current sort, then render.
function applyDisplay() {
  const search = state.filters.search || '';
  let rows = state.results.filter(r => !state.excludedSectors.has(r.evrk_code));
  if (search) rows = rows.filter(r => (r.name + ' ' + r.jar).toLowerCase().includes(search));
  sortRows(rows);
  state.display = rows;
  renderMeta();
  renderHead();
  setupVirtual();
}

/* ==========================================================
 *  Sorting
 * ========================================================== */
function sortValue(row, col) {
  if (col === 'name') return row.name || '';
  if (col === 'sector') return row.evrk_name || '';
  if (col === 'salary') { const s = latestSalary(row.jar); return s ? s.value : null; }
  return row[col]; // rev_YYYY / ebt_YYYY
}
function sortRows(rows) {
  const col = state.sortCol, dir = state.sortDir;
  const isText = (col === 'name' || col === 'sector');
  rows.sort((a, b) => {
    const va = sortValue(a, col), vb = sortValue(b, col);
    const na = (va == null || (typeof va === 'number' && isNaN(va)) || va === '');
    const nb = (vb == null || (typeof vb === 'number' && isNaN(vb)) || vb === '');
    if (na && nb) return 0;
    if (na) return 1;            // blanks always last
    if (nb) return -1;
    let r = isText ? String(va).localeCompare(String(vb), 'lt') : (va - vb);
    return dir === 'asc' ? r : -r;
  });
}
async function sortBy(col) {
  if (col === 'salary') {
    // Salary sort needs the value for every displayed row → ensure SODRA loaded.
    const need = state.display.filter(r => !sodraFetchedJars.has(r.jar)).map(r => r.jar);
    if (need.length) { const t = showToast(`Loading salary data for ${need.length.toLocaleString()} companies…`); try { await ensureSodraLoaded(need); } finally { hideToast(); } }
  }
  if (state.sortCol === col) state.sortDir = (state.sortDir === 'asc' ? 'desc' : 'asc');
  else { state.sortCol = col; state.sortDir = (col === 'name' || col === 'sector') ? 'asc' : 'desc'; }
  applyDisplay();
}

/* ==========================================================
 *  Table rendering (virtualized)
 * ========================================================== */
function colDefs() {
  const cols = [
    { key: 'name', label: 'Company', cls: 'col-name left' },
    { key: 'sector', label: 'Sector (EVRK)', cls: 'col-sector left' }
  ];
  for (const y of FIN_YEARS) cols.push({ key: 'rev_' + y, label: 'Sales ' + y, cls: '' });
  for (const y of FIN_YEARS) cols.push({ key: 'ebt_' + y, label: 'EBT ' + y, cls: '' });
  cols.push({ key: 'salary', label: 'Avg salary (latest)', cls: '' });
  return cols;
}
function renderHead() {
  const head = document.getElementById('rthead');
  const arrow = state.sortDir === 'asc' ? '▲' : '▼';
  head.innerHTML = '<tr>' + colDefs().map(c => {
    const active = state.sortCol === c.key;
    return `<th class="${c.cls}" onclick="sortBy('${c.key}')" title="Sort by ${escapeHtml(c.label)}">${escapeHtml(c.label)}${active ? `<span class="arr">${arrow}</span>` : ''}</th>`;
  }).join('') + '</tr>';
}
function renderMeta() {
  const total = state.display.length, all = state.results.length;
  document.getElementById('rmCount').textContent =
    all === total ? `${total.toLocaleString()} companies` : `${total.toLocaleString()} of ${all.toLocaleString()} companies`;
  document.getElementById('resultCount').textContent = `${total.toLocaleString()} co.`;
  const f = state.filters, parts = [];
  parts.push(`year ${f.year}`);
  if (f.muni) parts.push(f.muni);
  if (f.minRev != null || f.maxRev != null) parts.push(`Rev ${f.minRev != null ? '€' + fmtEUR(f.minRev) : ''}${(f.minRev!=null&&f.maxRev!=null)?'–':''}${f.maxRev != null ? '€' + fmtEUR(f.maxRev) : ''}`);
  if (f.minEbt != null || f.maxEbt != null) parts.push(`EBT ${f.minEbt != null ? '€' + fmtEUR(f.minEbt) : ''}${(f.minEbt!=null&&f.maxEbt!=null)?'–':''}${f.maxEbt != null ? '€' + fmtEUR(f.maxEbt) : ''}`);
  if (f.minMargin != null || f.maxMargin != null) parts.push(`Margin ${f.minMargin != null ? f.minMargin + '%' : ''}${(f.minMargin!=null&&f.maxMargin!=null)?'–':''}${f.maxMargin != null ? f.maxMargin + '%' : ''}`);
  if (f.minSal != null || f.maxSal != null) parts.push(`Salary ${f.minSal != null ? '€' + fmtEUR(f.minSal) : ''}${(f.minSal!=null&&f.maxSal!=null)?'–':''}${f.maxSal != null ? '€' + fmtEUR(f.maxSal) : ''}`);
  if (f.minEmp != null) parts.push(`Emp ≥ ${f.minEmp}`);
  document.getElementById('rmFilters').textContent = 'Filters: ' + parts.join(' · ');
}

function cellNum(v) {
  if (v == null || isNaN(v)) return '<span class="muted">—</span>';
  return v < 0 ? `<span class="neg">${fmtEUR(v)}</span>` : fmtEUR(v);
}
function salaryCell(jar) {
  if (!sodraFetchedJars.has(jar)) return '<span class="muted">…</span>';
  const s = latestSalary(jar);
  if (!s) return '<span class="muted">—</span>';
  return `${fmtEUR(s.value)}<span class="salyr">'${String(s.year).slice(2)}</span>`;
}
function rowHtml(r) {
  let tds = `<td class="col-name" title="${escapeHtml(r.name)} · JAR ${escapeHtml(r.jar)}">${escapeHtml(r.name)}</td>`;
  tds += `<td class="col-sector" title="${escapeHtml(r.evrk_name)}">${escapeHtml(r.evrk_name)}</td>`;
  for (const y of FIN_YEARS) tds += `<td>${cellNum(r['rev_' + y])}</td>`;
  for (const y of FIN_YEARS) tds += `<td>${cellNum(r['ebt_' + y])}</td>`;
  tds += `<td title="latest available SODRA year">${salaryCell(r.jar)}</td>`;
  return `<tr>${tds}</tr>`;
}

let virtualScrollBound = false;
function setupVirtual() {
  const scroller = document.getElementById('tableScroll');
  if (!virtualScrollBound) { scroller.addEventListener('scroll', renderWindow, { passive: true }); virtualScrollBound = true; }
  renderWindow();
}
let lazyGuard = false;
function renderWindow() {
  const scroller = document.getElementById('tableScroll');
  const tbody = document.getElementById('rtbody');
  const rows = state.display;
  const nCols = colDefs().length;
  if (!rows.length) { tbody.innerHTML = `<tr><td class="spacer" colspan="${nCols}"><div class="empty-state">No companies match. Adjust the filters or re-tick sectors.</div></td></tr>`; return; }

  const viewH = scroller.clientHeight || 600;
  const scrollTop = scroller.scrollTop;
  let start = Math.floor(scrollTop / ROW_H) - ROW_BUFFER;
  let end = Math.ceil((scrollTop + viewH) / ROW_H) + ROW_BUFFER;
  start = Math.max(0, start);
  end = Math.min(rows.length, end);

  const visible = rows.slice(start, end);
  const topPad = start * ROW_H;
  const botPad = (rows.length - end) * ROW_H;

  let html = '';
  if (topPad > 0) html += `<tr><td class="spacer" colspan="${nCols}" style="height:${topPad}px"></td></tr>`;
  html += visible.map(rowHtml).join('');
  if (botPad > 0) html += `<tr><td class="spacer" colspan="${nCols}" style="height:${botPad}px"></td></tr>`;
  tbody.innerHTML = html;

  // Lazy-load SODRA for the visible rows so the salary column fills in.
  if (!lazyGuard) {
    const need = visible.filter(r => !sodraFetchedJars.has(r.jar)).map(r => r.jar);
    if (need.length) {
      lazyGuard = true;
      ensureSodraLoaded(need).then(() => { lazyGuard = false; renderWindow(); }).catch(() => { lazyGuard = false; });
    }
  }
}

/* ==========================================================
 *  Clear
 * ========================================================== */
function clearFilters() {
  ['f-search','f-emp','f-rev-min','f-rev-max','f-ebt-min','f-ebt-max','f-margin-min','f-margin-max','f-sal-min','f-sal-max']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const muni = document.getElementById('f-muni'); if (muni) muni.value = '';
  const yr = document.getElementById('f-year'); if (yr) yr.value = String(FIN_LATEST_YEAR);
  const hi = document.getElementById('f-hide-inactive'); if (hi) hi.checked = true;
  state.excludedSectors.clear();
  runScreen();
}

/* ==========================================================
 *  Excel export
 * ========================================================== */
const EX = { EARTH:'FF454132', EARTH_LIGHT:'FF6A6552', GOLD:'FFA77A00', BG_ZEBRA:'FFF5F2E8', TEXT:'FF2A2820', WHITE:'FFFFFFFF' };
const thinBorder = { top:{style:'thin',color:{argb:'FFE5E1D5'}}, left:{style:'thin',color:{argb:'FFE5E1D5'}}, bottom:{style:'thin',color:{argb:'FFE5E1D5'}}, right:{style:'thin',color:{argb:'FFE5E1D5'}} };

async function exportExcel() {
  if (!state.display.length) { showToast('Nothing to export — adjust filters.'); return; }
  const t = showToast('Preparing salary data for export…');
  try {
    const need = state.display.filter(r => !sodraFetchedJars.has(r.jar)).map(r => r.jar);
    if (need.length) await ensureSodraLoaded(need);
  } finally { hideToast(); }

  // Re-sort with full salary data now available (in case sorted by salary).
  sortRows(state.display);

  const t2 = showToast('Building Excel…');
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Confidentus CompanyDB'; wb.created = new Date();
    const sheet = wb.addWorksheet('Targets', { properties: { defaultRowHeight: 16 }, views: [{ showGridLines: false, state: 'frozen', xSplit: 1, ySplit: 6 }] });

    sheet.columns = [{ width: 44 }, { width: 34 }]
      .concat(FIN_YEARS.map(() => ({ width: 15 })))   // sales
      .concat(FIN_YEARS.map(() => ({ width: 15 })))   // ebt
      .concat([{ width: 16 }, { width: 11 }]);        // salary + salary year
    const nCols = 2 + FIN_YEARS.length * 2 + 2;

    // Logo
    try { const imgId = wb.addImage({ base64: document.querySelector('.brand-logo').src, extension: 'png' });
      sheet.addImage(imgId, { tl: { col: 0, row: 0 }, ext: { width: 150, height: 28 } }); } catch(e) {}

    // Title
    const titleRow = sheet.addRow(['TARGET SEARCH — company screen']);
    sheet.mergeCells(titleRow.number, 1, titleRow.number, nCols);
    sheet.getCell(titleRow.number, 1).font = { name:'Calibri', size:15, bold:true, color:{argb:EX.EARTH} };
    titleRow.height = 22;

    const f = state.filters; const parts = [`Filter year ${f.year}`];
    if (f.muni) parts.push(f.muni);
    if (f.minRev != null || f.maxRev != null) parts.push(`Revenue ${f.minRev ?? ''}–${f.maxRev ?? ''}`);
    if (f.minEbt != null || f.maxEbt != null) parts.push(`EBT ${f.minEbt ?? ''}–${f.maxEbt ?? ''}`);
    if (f.minMargin != null || f.maxMargin != null) parts.push(`Margin ${f.minMargin ?? ''}%–${f.maxMargin ?? ''}%`);
    if (f.minSal != null || f.maxSal != null) parts.push(`Salary ${f.minSal ?? ''}–${f.maxSal ?? ''}`);
    if (f.minEmp != null) parts.push(`Min employees ${f.minEmp}`);
    const subRow = sheet.addRow([parts.join('  ·  ')]);
    sheet.mergeCells(subRow.number, 1, subRow.number, nCols);
    sheet.getCell(subRow.number, 1).font = { name:'Calibri', size:10.5, italic:true, color:{argb:EX.EARTH_LIGHT} };

    const metaRow = sheet.addRow([`${state.display.length.toLocaleString()} companies · exported ${new Date().toISOString().slice(0,10)} · amounts in €`]);
    sheet.mergeCells(metaRow.number, 1, metaRow.number, nCols);
    sheet.getCell(metaRow.number, 1).font = { name:'Calibri', size:10, color:{argb:EX.EARTH_LIGHT} };
    sheet.addRow([]);

    // Header
    const headers = ['Company', 'Sector (EVRK)']
      .concat(FIN_YEARS.map(y => 'Sales ' + y))
      .concat(FIN_YEARS.map(y => 'EBT ' + y))
      .concat(['Avg salary (latest)', 'Salary year']);
    const hr = sheet.addRow(headers);
    headers.forEach((h, i) => {
      const cell = sheet.getCell(hr.number, i + 1);
      cell.font = { name:'Calibri', size:10.5, bold:true, color:{argb:EX.WHITE} };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:EX.EARTH} };
      cell.alignment = { vertical:'middle', horizontal: i < 2 ? 'left' : 'right', wrapText:true };
      cell.border = { ...thinBorder, bottom:{ style:'medium', color:{argb:EX.GOLD} } };
    });
    hr.height = 24;

    const firstData = hr.number + 1;
    for (const r of state.display) {
      const sal = latestSalary(r.jar);
      const vals = [r.name, r.evrk_name];
      for (const y of FIN_YEARS) vals.push(r['rev_' + y] != null ? r['rev_' + y] : null);
      for (const y of FIN_YEARS) vals.push(r['ebt_' + y] != null ? r['ebt_' + y] : null);
      vals.push(sal ? sal.value : null);
      vals.push(sal ? sal.year : null);
      const row = sheet.addRow(vals);
      vals.forEach((v, i) => {
        const cell = sheet.getCell(row.number, i + 1);
        cell.font = { name:'Calibri', size:11, color:{argb:EX.TEXT} };
        cell.border = thinBorder;
        if (i >= 2) { cell.alignment = { horizontal:'right' }; if (i < nCols - 1) cell.numFmt = '#,##0'; }
      });
    }
    const lastData = firstData + state.display.length - 1;
    for (let rr = firstData; rr <= lastData; rr++) if ((rr - firstData) % 2 === 1)
      for (let cc = 1; cc <= nCols; cc++) { const cell = sheet.getCell(rr, cc); if (!cell.fill || !cell.fill.fgColor) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:EX.BG_ZEBRA} }; }
    if (lastData >= firstData) sheet.autoFilter = { from: { row: hr.number, column: 1 }, to: { row: lastData, column: nCols } };

    const buf = await wb.xlsx.writeBuffer();
    const fname = `Confidentus_TargetSearch_${new Date().toISOString().slice(0,10)}.xlsx`;
    saveAs(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fname);
    showToast(`Exported ${fname}`);
  } catch(e) { console.error(e); showToast('Export failed: ' + e.message); }
  finally { hideToast(); }
}

/* ==========================================================
 *  Boot
 * ========================================================== */
async function boot() {
  showOverlay();
  try {
    const res = await loadAllData();
    updateRefreshedIndicator();
    state.sortCol = 'rev_' + FIN_LATEST_YEAR;
    state.sortDir = 'desc';
    const yr = document.getElementById('f-year'); if (yr) yr.value = String(FIN_LATEST_YEAR);
    hideOverlay();
    await runScreen();
    // Background refresh if cache is old
    if (res.fromCache && res.cachedAt && (Date.now() - res.cachedAt > CACHE_TTL)) {
      fetchAndInstallData(true).then(() => { scheduleScreen(0); updateRefreshedIndicator(); }).catch(()=>{});
    }
  } catch(e) {
    console.error(e);
    setLoading('Failed to load: ' + e.message);
  }
}
window.addEventListener('resize', () => { if (state.display && state.display.length) renderWindow(); });
boot();
</script>
